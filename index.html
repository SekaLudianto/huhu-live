<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KATLA LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1f2937; }
      ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

      .tile-container {
        perspective: 1000px;
      }
      .tile-flipper {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }
      .tile-flipper.is-flipped {
        transform: rotateX(180deg);
      }
      .tile-face {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem; /* text-2xl */
        line-height: 2rem;
        font-weight: 700;
        text-transform: uppercase;
        border-radius: 0.375rem; /* rounded-md */
        border-width: 2px;
      }
      .tile-front {
        transform: rotateX(0deg);
      }
      .tile-back {
        transform: rotateX(180deg);
      }

      @keyframes slideInDown {
        from {
          transform: translateY(-20%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-in-down {
        animation: slideInDown 0.4s ease-out forwards;
      }
      
      @keyframes toast-in-out {
        0% {
          transform: translateY(-150%);
          opacity: 0;
        }
        15%, 85% {
          transform: translateY(0);
          opacity: 1;
        }
        100% {
          transform: translateY(-150%);
          opacity: 0;
        }
      }
      .animate-toast-in-out {
        animation: toast-in-out 5s ease-in-out forwards;
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.25);
          opacity: 0.75;
        }
      }
      .animate-pulse-heart {
        animation: pulse 1.5s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^18.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^18.2.0/",
    "react/": "https://aistudiocdn.com/react@^18.2.0/",
    "socket.io-client": "https://aistudiocdn.com/socket.io-client@^4.8.1",
    "vite": "https://aistudiocdn.com/vite@^7.1.11",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.0.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-900 text-gray-200">
    <div id="root"></div>

  </body>
</html>
